<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CARTO Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="logo" href="/">CARTO<span>.</span></a><span>ADMIN DASHBOARD</span><a href="/">← Store</a></header><main class="section"><div id="loginBox" class="modal-box" style="margin:auto"><p class="eyebrow">PRIVATE ACCESS</p><h2>Admin login<span>.</span></h2><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="primary">Sign in</button></form><p class="muted">Set ADMIN_EMAIL and ADMIN_PASSWORD in Railway variables first.</p><div id="loginError" class="result"></div></div><div id="dashboard" hidden><div class="section-head"><div><p class="eyebrow">STORE CONTROL</p><h2>Orders<span>.</span></h2></div><button id="logout" class="add">Log out</button></div><div id="orders"></div><hr style="border-color:#ffffff22;margin:45px 0"><h2>Products<span>.</span></h2><form id="productForm" class="modal-box" style="max-width:600px;display:grid;gap:10px"><input name="name" placeholder="Product name" required><select name="category"><option>Clothing</option><option>Shoes</option></select><input name="price" type="number" placeholder="Price (₹)" required><input name="image" placeholder="Image URL"><input name="sizes" placeholder="Sizes separated by commas e.g. S,M,L,XL"><input name="stock" type="number" placeholder="Stock quantity"><textarea name="description" placeholder="Description"></textarea><button class="primary">Add product</button></form><div id="adminProducts"></div></div></main><script src="/admin.js"></script></body></html>
